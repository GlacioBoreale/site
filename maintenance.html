<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenzione - Glaciopia</title>
    <link rel="icon" type="image/x-icon" href="https://glaciopia-images.s3.eu-north-1.amazonaws.com/favicon.ico">
    <script>(function(){var t=localStorage.getItem('glaciopia_theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            transition: background 0.35s ease, color 0.35s ease;
        }
        [data-theme="light"] body {
            background: #f0f4ff;
            color: #0a0a14;
        }
        .container-maint {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }
        .maint-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: spin 3s linear infinite;
            display: inline-block;
        }
        .maint-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .maint-description {
            font-size: 1.15rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        [data-theme="light"] .maint-description {
            color: rgba(10,10,20,0.55);
        }
        .mini-footer {
            margin-top: 1rem;
            text-align: center;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
        }
        [data-theme="light"] .mini-footer {
            color: rgba(10,10,20,0.35);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .maint-title { font-size: 1.8rem; }
            .maint-description { font-size: 1rem; }
            .maint-icon { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="container-maint">
        <i class="fa-solid fa-gear maint-icon"></i>
        <h1 class="maint-title">Sito in manutenzione</h1>
        <p class="maint-description">Stiamo facendo qualche lavoro dietro le quinte per migliorare Glaciopia. Torna a trovarci tra poco!</p>
        <div class="mini-footer">Glaciopia</div>
    </div>
</body>
</html>
